<style>
:root {
  --bg: #141212;
  --bg-card: #1e1c1c;
  --bg-card-hover: #262323;
  --bg-input: #1a1818;
  --bg-sidebar: #1a1818;
  --orange: #FF6B35;
  --orange-dim: rgba(255,107,53,0.15);
  --orange-glow: rgba(255,107,53,0.3);
  --green: #4ADE80;
  --green-dim: rgba(74,222,128,0.15);
  --yellow: #FACC15;
  --yellow-dim: rgba(250,204,21,0.15);
  --red: #F87171;
  --red-dim: rgba(248,113,113,0.15);
  --blue: #60A5FA;
  --blue-dim: rgba(96,165,250,0.15);
  --text: #FCF6F5;
  --text-dim: #9CA3AF;
  --text-muted: #6B7280;
  --border: #2d2a2a;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --transition: 0.2s ease;
}

[data-theme="light"] {
  --bg: #F5F3EF;
  --bg-card: #FFFFFF;
  --bg-card-hover: #F0EDE8;
  --bg-input: #FAFAF8;
  --bg-sidebar: #EDEAE4;
  --orange: #E05A2B;
  --orange-dim: rgba(224,90,43,0.12);
  --orange-glow: rgba(224,90,43,0.25);
  --green: #22A855;
  --green-dim: rgba(34,168,85,0.12);
  --yellow: #D4A010;
  --yellow-dim: rgba(212,160,16,0.12);
  --red: #DC4444;
  --red-dim: rgba(220,68,68,0.12);
  --blue: #3B82F6;
  --blue-dim: rgba(59,130,246,0.12);
  --text: #1A1A1A;
  --text-dim: #5A5A5A;
  --text-muted: #8A8A8A;
  --border: #D6D3CC;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Layout */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform 0.3s ease;
}
.sidebar.collapsed { transform: translateX(-260px); }
.main { flex:1; margin-left: 260px; transition: margin-left 0.3s ease; }
.main.expanded { margin-left: 0; }

/* Sidebar */
.sidebar-header {
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo {
  width: 36px; height: 36px;
  background: var(--orange);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800;
}
.sidebar-title { font-size: 18px; font-weight: 700; }
.sidebar-nav { flex:1; padding: 12px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-dim);
  font-size: 14px; font-weight: 500;
  transition: all var(--transition);
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--bg-card); color: var(--text); }
.nav-item.active { background: var(--orange-dim); color: var(--orange); }
.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
.nav-divider { height:1px; background: var(--border); margin: 12px 0; }
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
.nav-item.settings-btn { margin: 0; }

/* Top bar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: rgba(20,18,18,0.85);
  backdrop-filter: blur(12px);
  z-index: 50;
}
.menu-toggle {
  display: none;
  background: none; border: none; color: var(--text); cursor: pointer;
  padding: 4px;
}
.menu-toggle svg { width: 24px; height: 24px; }
.topbar-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 14px;
  flex: 1;
  max-width: 400px;
}
.topbar-search svg { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }
.topbar-search input {
  background: none; border: none; color: var(--text);
  font-size: 14px; width: 100%; outline: none;
  font-family: inherit;
}
.topbar-search input::placeholder { color: var(--text-muted); }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

/* Content area */
.content { padding: 24px; max-width: 1200px; margin: 0 auto; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600;
  cursor: pointer; border: none;
  font-family: inherit;
  transition: all var(--transition);
}
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover { background: #e5602f; transform: translateY(-1px); box-shadow: 0 4px 12px var(--orange-glow); }
.btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--text-muted); }
.btn-ghost { background: none; color: var(--text-dim); }
.btn-ghost:hover { color: var(--text); background: var(--bg-card); }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn-lg { padding: 14px 28px; font-size: 16px; }
.btn-icon {
  width: 36px; height: 36px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer;
  transition: all var(--transition);
}
.btn-icon:hover { color: var(--text); background: var(--bg-card-hover); }
.btn-icon svg { width: 18px; height: 18px; }

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: all var(--transition);
}
.card:hover { border-color: var(--text-muted); }
.card-clickable { cursor: pointer; }
.card-clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

/* Study set grid */
.sets-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.set-card { position: relative; }
.set-card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.set-card-count { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; }
.set-card-progress { margin-top: 12px; }
.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  transform-origin: left;
  transition: transform 0.4s ease;
}
.progress-fill.green { background: var(--green); }
.progress-fill.orange { background: var(--orange); }
.progress-fill.yellow { background: var(--yellow); }
.progress-labels {
  display: flex; justify-content: space-between;
  margin-top: 6px; font-size: 11px; color: var(--text-muted);
}
.set-card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.tag {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px; font-weight: 500;
}
.tag-folder { background: var(--blue-dim); color: var(--blue); }
.due-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600;
  background: var(--orange-dim); color: var(--orange);
}
.set-card-actions {
  position: absolute; top: 16px; right: 16px;
  display: flex; gap: 4px;
  opacity: 0; transition: opacity var(--transition);
}
.set-card:hover .set-card-actions { opacity: 1; }
.set-card-actions button {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: none; background: var(--bg);
  color: var(--text-dim); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.set-card-actions button:hover { color: var(--red); }
.set-card-actions button svg { width: 14px; height: 14px; }

/* Dashboard hero */
.hero {
  text-align: center;
  padding: 48px 24px 32px;
}
.hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.hero p { color: var(--text-dim); font-size: 15px; margin-bottom: 24px; }
.create-methods {
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  margin-bottom: 32px;
}
.create-method {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 20px 28px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  min-width: 120px;
}
.create-method:hover { border-color: var(--orange); background: var(--orange-dim); }
.create-method svg { width: 28px; height: 28px; color: var(--orange); }
.create-method span { font-size: 13px; font-weight: 500; }

/* Create/Edit modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 90%; max-width: 640px;
  max-height: 85vh;
  overflow-y: auto;
  transform: translateY(20px);
  transition: transform 0.2s ease;
  box-shadow: var(--shadow);
}
.modal-overlay.active .modal { transform: translateY(0); }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}
.modal-header h2 { font-size: 18px; font-weight: 600; }
.modal-body { padding: 24px; }
.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
}

/* Form elements */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-dim); margin-bottom: 6px; }
.form-input, .form-textarea, .form-select {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition);
}
.form-input:focus, .form-textarea:focus { border-color: var(--orange); }
.form-textarea { resize: vertical; min-height: 120px; }
.form-select { cursor: pointer; }

.pdf-drop {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  background: var(--bg-input);
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  cursor: pointer;
  transition: var(--transition);
  font-size: 14px;
}
.pdf-drop:hover { border-color: var(--orange); color: var(--text); background: var(--orange-dim); }
.pdf-drop.loading { border-color: var(--orange); color: var(--orange); cursor: wait; }
.pdf-drop.done    { border-color: var(--green); color: var(--green); border-style: solid; }

/* Flashcard study mode */
.flashcard-container {
  display: flex; flex-direction: column; align-items: center;
  padding: 40px 24px;
}
.flashcard-progress-top {
  font-size: 14px; color: var(--text-dim); margin-bottom: 24px;
}
.flashcard-wrapper {
  perspective: 1000px;
  width: 100%; max-width: 560px;
  height: 340px;
  cursor: pointer;
  margin-bottom: 32px;
}
.flashcard {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s ease;
}
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px;
  text-align: center;
}
.flashcard-back { transform: rotateY(180deg); }
.flashcard-face-label {
  position: absolute; top: 16px; left: 20px;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  color: var(--text-muted); letter-spacing: 1px;
}
.flashcard-face h3 { font-size: 22px; font-weight: 600; line-height: 1.4; }
.flashcard-face p { font-size: 16px; color: var(--text-dim); line-height: 1.5; margin-top: 8px; }
.flashcard-nav {
  display: flex; align-items: center; gap: 16px;
}
.flashcard-nav .btn-icon { width: 48px; height: 48px; border-radius: 50%; }
.flashcard-nav .btn-icon svg { width: 24px; height: 24px; }
.flashcard-mastery {
  display: flex; gap: 8px; margin-top: 24px;
}
.mastery-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-dim);
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all var(--transition);
}
.mastery-btn:hover { border-color: var(--text-muted); color: var(--text); }
.mastery-btn.unfamiliar:hover, .mastery-btn.unfamiliar.active { background: var(--red-dim); color: var(--red); border-color: var(--red); }
.mastery-btn.learning:hover, .mastery-btn.learning.active { background: var(--yellow-dim); color: var(--yellow); border-color: var(--yellow); }
.mastery-btn.familiar:hover, .mastery-btn.familiar.active { background: var(--blue-dim); color: var(--blue); border-color: var(--blue); }
.mastery-btn.mastered:hover, .mastery-btn.mastered.active { background: var(--green-dim); color: var(--green); border-color: var(--green); }

/* Quiz mode */
.quiz-container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
.quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.quiz-question {
  font-size: 20px; font-weight: 600; line-height: 1.5;
  margin-bottom: 24px;
}
.quiz-options { display: flex; flex-direction: column; gap: 10px; }
.quiz-option {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  font-size: 15px;
}
.quiz-option:hover { border-color: var(--text-muted); }
.quiz-option.selected { border-color: var(--orange); background: var(--orange-dim); }
.quiz-option.correct { border-color: var(--green); background: var(--green-dim); }
.quiz-option.wrong { border-color: var(--red); background: var(--red-dim); }
.quiz-option-letter {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700;
  flex-shrink: 0;
}
.quiz-explanation {
  margin-top: 20px; padding: 16px;
  background: var(--bg); border-radius: var(--radius-sm);
  border-left: 3px solid var(--orange);
  font-size: 14px; line-height: 1.6; color: var(--text-dim);
}
.quiz-footer { display: flex; justify-content: center; margin-top: 24px; }
.quiz-results { text-align: center; padding: 48px 24px; }
.quiz-score {
  font-size: 64px; font-weight: 800; color: var(--orange);
  margin-bottom: 8px;
}
.quiz-score-label { font-size: 16px; color: var(--text-dim); margin-bottom: 24px; }

/* Written test */
.written-container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
.written-prompt {
  font-size: 18px; font-weight: 600; line-height: 1.5;
  margin-bottom: 20px;
}
.written-answer { margin-bottom: 16px; }
.written-answer .form-textarea { min-height: 100px; }
.written-feedback {
  padding: 16px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
  font-size: 14px; line-height: 1.6;
}
.written-feedback.correct { background: var(--green-dim); border-left: 3px solid var(--green); }
.written-feedback.partial { background: var(--yellow-dim); border-left: 3px solid var(--yellow); }
.written-feedback.wrong { background: var(--red-dim); border-left: 3px solid var(--red); }

/* Fill in the blank */
.fitb-container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
.fitb-sentence {
  font-size: 18px; line-height: 2;
  margin-bottom: 24px;
}
.fitb-blank {
  display: inline-block;
  min-width: 120px;
  border-bottom: 2px solid var(--orange);
  padding: 2px 4px;
  margin: 0 4px;
  background: none; border-top: none; border-left: none; border-right: none;
  color: var(--text); font-size: 18px;
  font-family: inherit;
  outline: none;
  text-align: center;
}
.fitb-blank.correct { border-color: var(--green); color: var(--green); }
.fitb-blank.wrong { border-color: var(--red); color: var(--red); }

/* AI Tutor chat */
.tutor-container {
  max-width: 640px; margin: 0 auto;
  display: flex; flex-direction: column;
  height: calc(100vh - 130px);
}
.tutor-messages {
  flex: 1; overflow-y: auto;
  padding: 24px 0;
  display: flex; flex-direction: column; gap: 16px;
}
.tutor-msg {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px; line-height: 1.6;
}
.tutor-msg.ai {
  align-self: flex-start;
  background: var(--bg-card);
  border: 1px solid var(--border);
}
.tutor-msg.user {
  align-self: flex-end;
  background: var(--orange);
  color: #fff;
}
.tutor-input-area {
  display: flex; gap: 8px;
  padding: 16px 0;
  border-top: 1px solid var(--border);
}
.tutor-input-area input {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  color: var(--text); font-size: 14px;
  font-family: inherit; outline: none;
}
.tutor-input-area input:focus { border-color: var(--orange); }

/* Settings */
.settings-container { max-width: 560px; margin: 0 auto; padding: 32px 24px; }
.settings-section { margin-bottom: 32px; }
.settings-section h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }

/* Study set detail */
.set-detail-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 24px;
  flex-wrap: wrap; gap: 16px;
}
.set-detail-header h1 { font-size: 24px; font-weight: 700; }
.set-detail-header p { color: var(--text-dim); font-size: 14px; margin-top: 4px; }
.study-modes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 28px;
}

<script>
/* ============================================================
   STATE MANAGEMENT
   ============================================================ */
const STORAGE_KEY = 'studyhub_data';
const SETTINGS_KEY = 'studyhub_settings';

const defaultState = {
  sets: [],
  folders: ['General'],
};

const defaultSettings = {
  apiKey: '',
  model: 'claude-sonnet-4-20250514',
};

let state = loadState();
let settings = loadSettings();
let currentPage = 'home';
let currentSetId = null;
let currentFolder = 'all';
let studyMode = null;
let quizData = null;
let writtenData = null;
let fitbData = null;

function loadState() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return d && d.sets ? d : { ...defaultState };
  } catch { return { ...defaultState }; }
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    return s && s.apiKey !== undefined ? s : { ...defaultSettings };
  } catch { return { ...defaultSettings }; }
}

let saveTimeout;
function saveState() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }, 300);
}

function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ============================================================
   SUPABASE CLOUD SYNC
   ============================================================ */
const SUPABASE_URL = 'https://eeffjgxtnmbwqlkvxsgl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlZmZqZ3h0bm1id3Fsa3Z4c2dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzY5MjgsImV4cCI6MjA5MTIxMjkyOH0.HymLpHDYCQZTgEMLsAumqp_ygHIG3VuDYa49RAbVamA';
const SYNC_TABLE = 'studyhub_sync';
const DEVICE_ID = localStorage.getItem('studyhub_device_id') || (() => { const id = genId(); localStorage.setItem('studyhub_device_id', id); return id; })();

let syncStatus = 'idle'; // idle, syncing, success, error

async function supabaseRequest(method, path, body = null) {
  const opts = {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'resolution=merge-duplicates,return=minimal' : 'return=minimal',
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, opts);
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`Supabase ${res.status}: ${text}`);
  }
  if (res.status === 204) return null;
  return res.json();
}

async function pushToCloud() {
  syncStatus = 'syncing';
  render();
  try {
    const payload = {
      id: DEVICE_ID,
      data: JSON.stringify(state),
      updated_at: new Date().toISOString(),
    };
    await supabaseRequest('POST', `${SYNC_TABLE}?on_conflict=id`, payload);
    syncStatus = 'success';
    toast('Synced to cloud', 'success');
  } catch (e) {
    syncStatus = 'error';
    toast(`Sync failed: ${e.message}`, 'error');
  }
  render();
}

async function pullFromCloud() {
  syncStatus = 'syncing';
  render();
  try {
    const rows = await supabaseRequest('GET', `${SYNC_TABLE}?order=updated_at.desc&limit=1`);
    if (!rows || !rows.length) {
      toast('No cloud data found. Push first.', 'error');
      syncStatus = 'idle';
      render();
      return;
    }
    const cloudData = JSON.parse(rows[0].data);
    if (!cloudData.sets) {
      toast('Invalid cloud data', 'error');
      syncStatus = 'error';
      render();
      return;
    }
    // Merge: cloud sets that don't exist locally get added, existing ones updated if cloud is newer
    const localById = {};
    state.sets.forEach(s => { localById[s.id] = s; });
    let added = 0, updated = 0;
    for (const cs of cloudData.sets) {
      if (!localById[cs.id]) {
        state.sets.push(cs);
        added++;
      } else {
        const local = localById[cs.id];
        if ((cs.createdAt || 0) > (local.createdAt || 0) || cs.cards.length !== local.cards.length) {
          Object.assign(local, cs);
          updated++;
        }
      }
    }
    if (cloudData.folders) {
      for (const f of cloudData.folders) {
        if (!state.folders.includes(f)) state.folders.push(f);
      }
    }
    saveState();
    syncStatus = 'success';
    toast(`Pulled from cloud: ${added} new, ${updated} updated`, 'success');
  } catch (e) {
    syncStatus = 'error';
    toast(`Pull failed: ${e.message}`, 'error');
  }
  render();
}

/* ============================================================
   SPACED REPETITION ENGINE
   ============================================================ */
function migrateCard(card) {
  if (card.nextReview === undefined) {
    card.nextReview = 0;
    card.interval = 0;
    card.easeFactor = 2.5;
    card.reviewCount = 0;
  }
  return card;
}

function masteryToQuality(level) {
  switch(level) {
    case 'unfamiliar': return 1;
    case 'learning': return 3;
    case 'familiar': return 4;
    case 'mastered': return 5;
    default: return 3;
  }
}

function computeSR(card, quality) {
  migrateCard(card);
  let { interval, easeFactor, reviewCount } = card;

  if (quality < 3) {
    interval = 0;
    reviewCount = 0;
  } else {
    reviewCount++;
    if (reviewCount === 1) interval = 1;
    else if (reviewCount === 2) interval = 6;
    else interval = Math.round(interval * easeFactor);
  }

  easeFactor = easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  if (easeFactor < 1.3) easeFactor = 1.3;

  card.interval = interval;
  card.easeFactor = Math.round(easeFactor * 100) / 100;
  card.reviewCount = reviewCount;
  card.nextReview = Date.now() + interval * 86400000;
}

function getCardsDue(set) {
  const now = Date.now();
  return set.cards
    .map((c, i) => ({ card: migrateCard(c), index: i }))
    .filter(({ card }) => !card.nextReview || card.nextReview <= now)
    .sort((a, b) => {
      const aPri = (a.card.mastery === 'unfamiliar' || a.card.mastery === 'learning') ? 0 : 1;
      const bPri = (b.card.mastery === 'unfamiliar' || b.card.mastery === 'learning') ? 0 : 1;
      if (aPri !== bPri) return aPri - bPri;
      return (a.card.nextReview || 0) - (b.card.nextReview || 0);
    })
    .map(({ index }) => index);
}

function getDueCount(set) { return getCardsDue(set).length; }

function getTotalDueCount() {
  return state.sets.reduce((sum, s) => sum + getDueCount(s), 0);
}

/* ============================================================
   AI MODULE
   ============================================================ */
async function callAI(systemPrompt, userPrompt, maxTokens = 2048) {
  if (!settings.apiKey) {
    toast('Set your API key in Settings first', 'error');
    throw new Error('No API key');
  }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': settings.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: settings.model,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [{ role: 'user', content: userPrompt }],
    }),
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`API error: ${res.status} ${err}`);
  }
  const data = await res.json();
  return data.content[0].text;
}

async function callAIChat(systemPrompt, messages, maxTokens = 1024) {
  if (!settings.apiKey) {
    toast('Set your API key in Settings first', 'error');
    throw new Error('No API key');
  }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': settings.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: settings.model,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: messages,
    }),
  });
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  const data = await res.json();
  return data.content[0].text;
}

async function generateFlashcards(content, count = 15) {
  const sys = `You are a study assistant. Generate flashcards from the provided content. Return ONLY valid JSON array with objects: [{"term":"...","definition":"..."}]. No markdown, no explanation. Generate up to ${count} flashcards covering the key concepts.`;
  const text = await callAI(sys, content, 4096);
  const match = text.match(/\[[\s\S]*\]/);
  if (!match) throw new Error('Invalid AI response');
  return JSON.parse(match[0]);
}

async function generateQuiz(cards) {
  const cardText = cards.map(c => `Term: ${c.term}\nDefinition: ${c.definition}`).join('\n\n');

  const text = await callAI(sys, cardText, 4096);
  const match = text.match(/\[[\s\S]*\]/);
  if (!match) throw new Error('Invalid AI response');

/* ============================================================
   PDF IMPORT
   ============================================================ */
async function extractPdfText(file) {
  if (!window.pdfjsLib) throw new Error('PDF library not loaded — check your internet connection and reload');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const parts = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    parts.push(content.items.map(it => it.str).join(' '));
  }
  return { text: parts.join('\n\n').replace(/\s+/g, ' ').trim(), pages: pdf.numPages };
}

async function handlePdfUpload(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const label = document.getElementById('pdfDropLabel');
  const labelText = document.getElementById('pdfDropText');
  label.className = 'pdf-drop loading';
  labelText.textContent = `Reading ${file.name}...`;
  try {
    const { text, pages } = await extractPdfText(file);
    const MAX_CHARS = 60000;
    const truncated = text.length > MAX_CHARS;
    const finalText = truncated ? text.slice(0, MAX_CHARS) : text;
    const textarea = document.getElementById('newSetContent');
    textarea.value = textarea.value ? `${textarea.value}\n\n${finalText}` : finalText;
    label.className = 'pdf-drop done';
    labelText.textContent = `${file.name} — ${pages} pages, ${finalText.length.toLocaleString()} chars extracted${truncated ? ' (truncated)' : ''}`;
    if (text.length < pages * 100) {
      toast('Very little text extracted — this PDF may be scanned (image-based). OCR support is planned.', 'info');
    } else if (truncated) {
      toast(`PDF trimmed to ${MAX_CHARS.toLocaleString()} chars to stay within generation limits`, 'info');
    } else {
      toast(`Extracted ${pages} pages`, 'success');
    }
  } catch (e) {
    label.className = 'pdf-drop';
    labelText.textContent = 'Click to choose a PDF';
    toast(`Could not read PDF: ${e.message}`, 'error');
    event.target.value = '';
  }
}

/* ============================================================
   UI HELPERS
   ============================================================ */
function toast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebarOverlay');
  sb.classList.toggle('open');
  ov.classList.toggle('active');
}

document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
});

function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('active');
}

function forceCloseModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function navigate(page, id) {
  currentPage = page;
  currentSetId = id || null;
  studyMode = null;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navItem = document.querySelector(`.nav-item[data-page="${page}"]`);
  if (navItem) navItem.classList.add('active');
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
  render();
}

function handleSearch() {
  if (currentPage !== 'home') navigate('home');
  else render();
}

function filterFolder(folder) {
  currentFolder = folder;
  document.querySelectorAll('.nav-item[data-folder]').forEach(n => n.classList.remove('active'));
  const el = document.querySelector(`.nav-item[data-folder="${folder}"]`);
  if (el) el.classList.add('active');
  if (currentPage !== 'home') navigate('home');
  else render();
}

/* ============================================================
   RENDERING
   ============================================================ */
function render() {
  const el = document.getElementById('pageContent');
  switch(currentPage) {
    case 'home': el.innerHTML = renderHome(); break;
    case 'set': el.innerHTML = renderSetDetail(); break;
    case 'flashcards': el.innerHTML = renderFlashcards(); break;
    case 'quiz': el.innerHTML = renderQuiz(); break;
    case 'written': el.innerHTML = renderWritten(); break;
    case 'fitb': el.innerHTML = renderFITB(); break;
    case 'tutor': el.innerHTML = renderTutor(); break;
    case 'settings': el.innerHTML = renderSettings(); break;
    default: el.innerHTML = renderHome();
  }
  renderFolders();
  const _tm = document.getElementById('tutorMessages');
  if (_tm) _tm.scrollTop = _tm.scrollHeight;
}

function renderFolders() {
  const el = document.getElementById('folderList');
  el.innerHTML = state.folders.map(f => `
    <div class="folder-item ${currentFolder === f ? 'active' : ''}" onclick="filterFolder('${f.replace(/'/g,"\\'")}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      ${f}
    </div>
  `).join('');
}

function getFilteredSets() {
  let sets = state.sets;
  const q = document.getElementById('searchInput')?.value?.toLowerCase() || '';
  if (q) sets = sets.filter(s => s.title.toLowerCase().includes(q) || (s.description||'').toLowerCase().includes(q));
  if (currentFolder !== 'all') sets = sets.filter(s => s.folder === currentFolder);
  return sets;
}

function getMasteryPercent(set) {
  if (!set.cards || !set.cards.length) return 0;
  const mastered = set.cards.filter(c => c.mastery === 'mastered').length;
  const familiar = set.cards.filter(c => c.mastery === 'familiar').length;
  return Math.round((mastered * 100 + familiar * 50) / set.cards.length);
}

function getMasteryColor(pct) {
  if (pct >= 70) return 'green';
  if (pct >= 40) return 'orange';
  return 'yellow';
}

/* ============================================================
   YOUTUBE IMPORT
   ============================================================ */
function extractYouTubeId(url) {
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
    /^([a-zA-Z0-9_-]{11})$/,
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

async function fetchYouTubeInfo() {
  const urlInput = document.getElementById('ytUrl');
  const statusEl = document.getElementById('ytStatus');
  const titleInput = document.getElementById('newSetTitle');
  const url = urlInput.value.trim();
  if (!url) { toast('Paste a YouTube URL', 'error'); return; }

  const videoId = extractYouTubeId(url);
  if (!videoId) { toast('Invalid YouTube URL', 'error'); return; }

  statusEl.textContent = 'Fetching video info...';
  statusEl.style.color = 'var(--orange)';

  try {
    const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
    if (res.ok) {
      const data = await res.json();
      if (data.title) {
        if (!titleInput.value.trim()) titleInput.value = data.title;
        statusEl.innerHTML = `<span style="color:var(--green)">✓</span> <strong>${escHtml(data.title)}</strong> by ${escHtml(data.author_name || 'Unknown')}`;
        statusEl.style.color = 'var(--text-dim)';
      } else {
        statusEl.textContent = 'Video found.';
        statusEl.style.color = 'var(--text-muted)';
      }
    } else {
      statusEl.textContent = 'Could not fetch video info.';
      statusEl.style.color = 'var(--text-muted)';
    }
  } catch {
    statusEl.textContent = 'Network error fetching info.';
    statusEl.style.color = 'var(--text-muted)';
  }

  // Auto-fetch transcript
  const transcriptEl = document.getElementById('ytTranscript');
  if (!transcriptEl.value.trim()) {
    statusEl.innerHTML += ' <span style="color:var(--orange)">— fetching transcript...</span>';
    const result = await fetchYouTubeTranscript(videoId);
    if (result.text) {
      transcriptEl.value = result.text;
      statusEl.innerHTML = statusEl.innerHTML.replace(/ <span style="color:var\(--orange\)">.*?<\/span>/, '');
      statusEl.innerHTML += ` <span style="color:var(--green)">· Transcript loaded (${result.auto ? 'auto-generated' : 'manual captions'})</span>`;
      toast('Transcript extracted automatically', 'success');
    } else {
      statusEl.innerHTML = statusEl.innerHTML.replace(/ <span style="color:var\(--orange\)">.*?<\/span>/, '');
      statusEl.innerHTML += ' <span style="color:var(--text-muted)">· Paste transcript manually below</span>';
    }
  }
}

async function fetchYouTubeTranscript(videoId) {
  const proxies = [
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  ];

  async function fetchViaProxy(url) {
    for (const makeUrl of proxies) {
      try {
        const res = await fetch(makeUrl(url));
        if (res.ok) return await res.text();
      } catch { /* try next proxy */ }
    }
    return null;
  }

  try {
    // Step 1: Fetch the YouTube page HTML
    const pageHtml = await fetchViaProxy(`https://www.youtube.com/watch?v=${videoId}`);
    if (!pageHtml) return { text: null, auto: false, error: 'proxy_unavailable' };

    // Step 2: Extract captionTracks from the embedded JSON
    const captionMatch = pageHtml.match(/"captionTracks"\s*:\s*(\[.*?\])/);
    if (!captionMatch) return { text: null, auto: false, error: 'no_captions' };

    let tracks;
    try { tracks = JSON.parse(captionMatch[1]); } catch {
      return { text: null, auto: false, error: 'parse_failed' };
    }
    if (!tracks.length) return { text: null, auto: false, error: 'no_captions' };

    // Step 3: Pick best track — prefer English manual > English ASR > any manual > any ASR
    const score = t => {
      let s = 0;
      if ((t.languageCode || '').startsWith('en')) s += 10;
      if (t.kind !== 'asr') s += 5; // manual captions
      return s;
    };
    tracks.sort((a, b) => score(b) - score(a));
    const best = tracks[0];
    const isAuto = best.kind === 'asr';

    // Step 4: Fetch the caption XML
    const captionXml = await fetchViaProxy(best.baseUrl);
    if (!captionXml) return { text: null, auto: false, error: 'caption_fetch_failed' };

    // Step 5: Parse XML and extract text
    const parser = new DOMParser();
    const doc = parser.parseFromString(captionXml, 'text/xml');
    const textNodes = doc.querySelectorAll('text');
    if (!textNodes.length) return { text: null, auto: false, error: 'parse_failed' };

    const transcript = Array.from(textNodes)
      .map(n => n.textContent.replace(/&#39;/g, "'").replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>'))
      .join(' ')
      .replace(/\s+/g, ' ')
      .trim();

    return { text: transcript, auto: isAuto, error: null };
  } catch {
    return { text: null, auto: false, error: 'unknown' };
  }
}

async function createSetYouTube() {
  const title = document.getElementById('newSetTitle').value.trim();
  const transcript = document.getElementById('ytTranscript').value.trim();
  const count = parseInt(document.getElementById('newSetCount').value) || 20;
  const folder = document.getElementById('newSetFolder').value;
  const urlVal = (document.getElementById('ytUrl').value || '').trim();

  if (!title) { toast('Enter a title', 'error'); return; }
  if (!transcript) { toast('Paste the video transcript', 'error'); return; }

  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Generating...';

  try {
    // Clean transcript: remove timestamps like [00:00] or 0:00
    const cleaned = transcript.replace(/\[?\d{1,2}:\d{2}(?::\d{2})?\]?\s*/g, ' ').replace(/\s+/g, ' ').trim();
    const maxChars = 60000;
    const finalText = cleaned.length > maxChars ? cleaned.slice(0, maxChars) : cleaned;

    const cards = await generateFlashcards(
      `This is a transcript from a YouTube video titled "${title}". Extract the key concepts, facts, and ideas:\n\n${finalText}`,
      count
    );

    const set = {
      id: genId(),
      title,
      folder,
      cards: cards.map(c => ({ ...c, id: genId(), mastery: 'unfamiliar', nextReview: 0, interval: 0, easeFactor: 2.5, reviewCount: 0 })),
      createdAt: Date.now(),
      source: urlVal ? `youtube:${urlVal}` : 'youtube',
    };
    state.sets.unshift(set);
    saveState();
    forceCloseModal();
    toast(`Created "${title}" with ${set.cards.length} cards from YouTube`, 'success');
    navigate('set', set.id);
  } catch(e) {
    toast(e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '🎬 Generate from Video';
  }
}

/* ============================================================
   PDF STANDALONE IMPORT
   ============================================================ */
async function handlePdfUploadStandalone(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const label = document.getElementById('pdfDropLabel2');
  const labelText = document.getElementById('pdfDropText2');
  label.className = 'pdf-drop loading';
  labelText.textContent = `Reading ${file.name}...`;
  try {
    const { text, pages } = await extractPdfText(file);
    const MAX_CHARS = 60000;
    const truncated = text.length > MAX_CHARS;
    const finalText = truncated ? text.slice(0, MAX_CHARS) : text;
    label.className = 'pdf-drop done';
    labelText.textContent = `${file.name} — ${pages} pages`;
    // Show preview
    const previewGroup = document.getElementById('pdfPreviewGroup');
    const previewText = document.getElementById('pdfExtractedText');
    const charCount = document.getElementById('pdfCharCount');
    previewGroup.style.display = 'block';
    previewText.value = finalText;
    charCount.textContent = `${finalText.length.toLocaleString()} characters extracted from ${pages} page${pages !== 1 ? 's' : ''}${truncated ? ' (truncated to 60k)' : ''}`;
    if (text.length < pages * 100) {
      toast('Very little text extracted — this PDF may be scanned (image-based)', 'info');
    } else if (truncated) {
      toast(`PDF trimmed to ${MAX_CHARS.toLocaleString()} chars`, 'info');
    } else {
      toast(`Extracted ${pages} pages`, 'success');
    }
  } catch (e) {
    label.className = 'pdf-drop';
    labelText.textContent = 'Click to choose a PDF or drag & drop';
    toast(`Could not read PDF: ${e.message}`, 'error');
    event.target.value = '';
  }
}

/* ============================================================
   FLASHCARD MODE
   ============================================================ */
let fcIndex = 0;
let fcFlipped = false;
let fcCardIndices = null;

function startFlashcards() {
  const set = getSet();
  if (!set || !set.cards.length) { toast('No cards to study', 'error'); return; }
  const dueIndices = getCardsDue(set);
  const allIndices = set.cards.map((_, i) => i);
  const nonDue = allIndices.filter(i => !dueIndices.includes(i));
  fcCardIndices = [...dueIndices, ...nonDue];
  fcIndex = 0;
  fcFlipped = false;
  currentPage = 'flashcards';
  render();
}

function startStudyDue() {
  const set = getSet();
  if (!set) return;
  const dueIndices = getCardsDue(set);
  if (!dueIndices.length) { toast('No cards due for review!', 'success'); return; }
  fcCardIndices = dueIndices;
  fcIndex = 0;
  fcFlipped = false;
  currentPage = 'flashcards';
  render();
}

function renderFlashcards() {
  const set = getSet();
  if (!set) return '';
  const actualIndex = fcCardIndices ? fcCardIndices[fcIndex] : fcIndex;
  const card = set.cards[actualIndex];
  const totalCards = fcCardIndices ? fcCardIndices.length : set.cards.length;
  migrateCard(card);
  const mastery = card.mastery || 'unfamiliar';
  const reviewInfo = card.nextReview && card.nextReview > Date.now()
    ? `<p style="font-size:12px;color:var(--text-muted);margin-top:8px">Next review: ${new Date(card.nextReview).toLocaleDateString()}</p>`
    : `<p style="font-size:12px;color:var(--orange);margin-top:8px">Due for review</p>`;
  return `
    <div class="flashcard-container">
      <button class="btn btn-ghost btn-sm" onclick="navigate('set','${set.id}')" style="align-self:flex-start;margin-bottom:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Set
      </button>
      <div class="flashcard-progress-top">Card ${fcIndex+1} of ${totalCards}</div>
      <div class="progress-bar" style="width:100%;max-width:560px;margin-bottom:24px;height:4px">
        <div class="progress-fill orange" style="transform:scaleX(${(fcIndex+1)/totalCards})"></div>
      </div>
      <div class="flashcard-wrapper" onclick="flipCard()">
        <div class="flashcard ${fcFlipped ? 'flipped' : ''}">
          <div class="flashcard-face">
            <div class="flashcard-face-label">Term</div>
            <h3>${escHtml(card.term)}</h3>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="flashcard-face-label">Definition</div>
            <p>${escHtml(card.definition)}</p>
          </div>
        </div>
      </div>
      <div class="flashcard-nav">
        <button class="btn-icon" onclick="fcPrev()" ${fcIndex===0?'disabled style="opacity:0.3"':''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span style="font-size:14px;color:var(--text-dim);min-width:60px;text-align:center">${fcIndex+1} / ${totalCards}</span>
        <button class="btn-icon" onclick="fcNext()" ${fcIndex>=totalCards-1?'disabled style="opacity:0.3"':''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="flashcard-mastery">
        <button class="mastery-btn unfamiliar ${mastery==='unfamiliar'?'active':''}" onclick="setMastery('unfamiliar')">Unfamiliar</button>
        <button class="mastery-btn learning ${mastery==='learning'?'active':''}" onclick="setMastery('learning')">Learning</button>
        <button class="mastery-btn familiar ${mastery==='familiar'?'active':''}" onclick="setMastery('familiar')">Familiar</button>
        <button class="mastery-btn mastered ${mastery==='mastered'?'active':''}" onclick="setMastery('mastered')">Mastered</button>
      </div>
      ${reviewInfo}
      <p style="font-size:12px;color:var(--text-muted);margin-top:8px">Click card to flip · Arrow keys to navigate · Space to flip</p>
    </div>
  `;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  const el = document.querySelector('.flashcard');
  if (el) el.classList.toggle('flipped', fcFlipped);
}

function fcPrev() {
  if (fcIndex > 0) { fcIndex--; fcFlipped = false; render(); }
}

function fcNext() {
  const total = fcCardIndices ? fcCardIndices.length : (getSet()?.cards.length || 0);
  if (fcIndex < total - 1) { fcIndex++; fcFlipped = false; render(); }
}

function setMastery(level) {
  const set = getSet();
  if (!set) return;
  const actualIndex = fcCardIndices ? fcCardIndices[fcIndex] : fcIndex;
  const card = set.cards[actualIndex];
  card.mastery = level;
  computeSR(card, masteryToQuality(level));
  saveState();
  render();
}

// Keyboard nav for flashcards
document.addEventListener('keydown', (e) => {
  if (currentPage !== 'flashcards') return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') fcPrev();
  else if (e.key === 'ArrowRight') fcNext();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

/* ============================================================
   QUIZ MODE
   ============================================================ */
let quizIndex = 0;
let quizAnswered = false;
let quizSelected = -1;
let quizScore = 0;
let quizDone = false;

async function startQuiz() {
  const set = getSet();
  if (!set || set.cards.length < 2) { toast('Need at least 2 cards for a quiz', 'error'); return; }

  currentPage = 'quiz';
  quizData = null;
  quizIndex = 0;
  quizAnswered = false;
  quizSelected = -1;
  quizScore = 0;
  quizDone = false;
  render(); // show loading

  try {
    quizData = await generateQuiz(set.cards);
    render();
  } catch(e) {
    toast(e.message, 'error');
    navigate('set', set.id);
  }
}

function renderQuiz() {
  const set = getSet();
  if (!set) return '';
  if (!quizData) return `
    <div class="content">
      <button class="btn btn-ghost btn-sm" onclick="navigate('set','${set.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div class="loading-overlay"><div class="spinner"></div>Generating quiz...</div>
    </div>`;

  if (quizDone) {
    const pct = Math.round((quizScore / quizData.length) * 100);
    return `
      <div class="quiz-results">
        <div class="quiz-score">${pct}%</div>
        <div class="quiz-score-label">${quizScore} of ${quizData.length} correct</div>
        <div style="display:flex;gap:8px;justify-content:center">
          <button class="btn btn-primary" onclick="startQuiz()">Try Again</button>
          <button class="btn btn-secondary" onclick="navigate('set','${set.id}')">Back to Set</button>
        </div>
      </div>`;
  }

  const q = quizData[quizIndex];
  const letters = ['A','B','C','D'];
  return `
    <div class="quiz-container">
      <button class="btn btn-ghost btn-sm" onclick="navigate('set','${set.id}')" style="margin-bottom:16px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div class="quiz-header">
        <span style="font-size:14px;color:var(--text-dim)">Question ${quizIndex+1} of ${quizData.length}</span>
        <span style="font-size:14px;color:var(--text-dim)">Score: ${quizScore}/${quizIndex}</span>
      </div>
      <div class="progress-bar" style="margin-bottom:24px;height:4px">
        <div class="progress-fill orange" style="transform:scaleX(${(quizIndex+1)/quizData.length})"></div>
      </div>
      <div class="quiz-question">${escHtml(q.question)}</div>
      <div class="quiz-options">
        ${q.options.map((opt, i) => {
          let cls = '';
          if (quizAnswered) {
            if (i === q.correct) cls = 'correct';
            else if (i === quizSelected && i !== q.correct) cls = 'wrong';
          } else if (i === quizSelected) cls = 'selected';
          return `
            <div class="quiz-option ${cls}" onclick="selectQuizOption(${i})">
              <div class="quiz-option-letter">${letters[i]}</div>
              <span>${escHtml(opt)}</span>
            </div>`;
        }).join('')}
      </div>
      ${quizAnswered ? `<div class="quiz-explanation">${escHtml(q.explanation)}</div>` : ''}
      <div class="quiz-footer">
        ${!quizAnswered ?
          `<button class="btn btn-primary" onclick="submitQuizAnswer()" ${quizSelected<0?'disabled style="opacity:0.4"':''}>Check Answer</button>` :
          `<button class="btn btn-primary" onclick="nextQuizQuestion()">Next</button>`}
      </div>
    </div>`;
}

function selectQuizOption(i) {
  if (quizAnswered) return;
  quizSelected = i;
  render();
}

function submitQuizAnswer() {
  if (quizSelected < 0 || quizAnswered) return;
  quizAnswered = true;
  if (quizSelected === quizData[quizIndex].correct) quizScore++;
  render();
}

function nextQuizQuestion() {
  if (quizIndex < quizData.length - 1) {
    quizIndex++;
    quizAnswered = false;
    quizSelected = -1;
    render();
  } else {
    quizDone = true;
    render();
  }
}

/* ============================================================
   WRITTEN TEST MODE
   ============================================================ */
let writtenIndex = 0;
let writtenFeedback = null;
let writtenGrading = false;

async function startWritten() {
  const set = getSet();
  if (!set || !set.cards.length) { toast('No cards to test', 'error'); return; }

  currentPage = 'written';
  writtenData = null;
  writtenIndex = 0;
  writtenFeedback = null;
  writtenGrading = false;
  render();

  try {
    writtenData = await generateWrittenQuestions(set.cards);
    render();
  } catch(e) {
    toast(e.message, 'error');
    navigate('set', set.id);
  }
}

function renderWritten() {
  const set = getSet();
  if (!set) return '';
  if (!writtenData) return `
    <div class="content">
      <button class="btn btn-ghost btn-sm" onclick="navigate('set','${set.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div class="loading-overlay"><div class="spinner"></div>Generating written test...</div>
    </div>`;

  if (writtenIndex >= writtenData.length) {
    return `
      <div class="quiz-results">
        <div class="quiz-score" style="font-size:48px">Done!</div>
        <div class="quiz-score-label">You completed all ${writtenData.length} questions</div>
        <div style="display:flex;gap:8px;justify-content:center">
          <button class="btn btn-primary" onclick="startWritten()">Try Again</button>
          <button class="btn btn-secondary" onclick="navigate('set','${set.id}')">Back to Set</button>
        </div>
      </div>`;
  }

  const q = writtenData[writtenIndex];
  return `
    <div class="written-container">
      <button class="btn btn-ghost btn-sm" onclick="navigate('set','${set.id}')" style="margin-bottom:16px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div style="font-size:14px;color:var(--text-dim);margin-bottom:8px">Question ${writtenIndex+1} of ${writtenData.length}</div>
      <div class="progress-bar" style="margin-bottom:24px;height:4px">
        <div class="progress-fill orange" style="transform:scaleX(${(writtenIndex+1)/writtenData.length})"></div>
      </div>
      <div class="written-prompt">${escHtml(q.question)}</div>
      <div class="written-answer">
        <textarea class="form-textarea" id="writtenAnswer" placeholder="Type your answer..." ${writtenFeedback?'disabled':''}></textarea>
      </div>
      ${writtenGrading ? '<div class="loading-overlay" style="padding:16px"><div class="spinner"></div>Grading...</div>' : ''}
      ${writtenFeedback ? `
        <div class="written-feedback ${writtenFeedback.grade}">
          <strong style="text-transform:capitalize">${writtenFeedback.grade}</strong><br>
          ${escHtml(writtenFeedback.feedback)}
        </div>
        <div style="text-align:center;margin-top:16px">
          <button class="btn btn-primary" onclick="nextWrittenQuestion()">Next Question</button>
        </div>
      ` : `
        <div style="text-align:center">
          <button class="btn btn-primary" onclick="submitWrittenAnswer()">Submit Answer</button>
        </div>
      `}
    </div>`;
}

async function submitWrittenAnswer() {
  const answer = document.getElementById('writtenAnswer')?.value?.trim();
  if (!answer) { toast('Write an answer first', 'error'); return; }

  writtenGrading = true;
  render();

  try {
    const q = writtenData[writtenIndex];
    writtenFeedback = await gradeWrittenAnswer(q.question, q.expectedAnswer, answer);
    writtenGrading = false;
    render();
  } catch(e) {
    writtenGrading = false;
    toast(e.message, 'error');
    render();
  }
}

function nextWrittenQuestion() {
  writtenIndex++;
  writtenFeedback = null;
  writtenGrading = false;
  render();
}

/* ============================================================
   FILL IN THE BLANK MODE
   ============================================================ */
let fitbIndex = 0;
let fitbChecked = false;
let fitbScore = 0;
let fitbTotal = 0;

async function startFITB() {
  const set = getSet();
  if (!set || !set.cards.length) { toast('No cards to study', 'error'); return; }

  currentPage = 'fitb';
  fitbData = null;
  fitbIndex = 0;
  fitbChecked = false;
  fitbScore = 0;
  fitbTotal = 0;
  render();

  try {
    fitbData = await generateFITB(set.cards);
    fitbTotal = fitbData.length;
    render();
  } catch(e) {
    toast(e.message, 'error');
    navigate('set', set.id);
  }
}

function renderFITB() {
  const set = getSet();
  if (!set) return '';
  if (!fitbData) return `
    <div class="content">
      <button class="btn btn-ghost btn-sm" onclick="navigate('set','${set.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div class="loading-overlay"><div class="spinner"></div>Generating exercises...</div>
    </div>`;

  if (fitbIndex >= fitbData.length) {
    return `
      <div class="quiz-results">
        <div class="quiz-score">${Math.round((fitbScore/fitbTotal)*100)}%</div>
        <div class="quiz-score-label">${fitbScore} of ${fitbTotal} correct</div>
        <div style="display:flex;gap:8px;justify-content:center">
          <button class="btn btn-primary" onclick="startFITB()">Try Again</button>
          <button class="btn btn-secondary" onclick="navigate('set','${set.id}')">Back to Set</button>
        </div>
      </div>`;
  }

  const item = fitbData[fitbIndex];
  const display = item.display || item.sentence.replace(/__BLANK__/g, '_____');
  const parts = display.split('_____');

  return `
    <div class="fitb-container">
      <button class="btn btn-ghost btn-sm" onclick="navigate('set','${set.id}')" style="margin-bottom:16px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div style="font-size:14px;color:var(--text-dim);margin-bottom:8px">Exercise ${fitbIndex+1} of ${fitbData.length}</div>
      <div class="progress-bar" style="margin-bottom:24px;height:4px">
        <div class="progress-fill orange" style="transform:scaleX(${(fitbIndex+1)/fitbData.length})"></div>
      </div>
      <div class="fitb-sentence">
        ${parts.map((p, i) => {
          if (i < parts.length - 1) {
            return escHtml(p) + `<input class="fitb-blank ${fitbChecked ? (document.getElementById('fitbInput')?.classList.contains('correct') ? 'correct' : '') : ''}" id="fitbInput" placeholder="..." ${fitbChecked?'disabled':''}>`;
          }
          return escHtml(p);
        }).join('')}
      </div>
      ${fitbChecked ? `
        <div style="margin-top:16px;padding:12px;border-radius:8px;background:var(--bg-card);font-size:14px">
          <strong>Answer:</strong> ${escHtml(item.answer)}
        </div>
        <div style="text-align:center;margin-top:16px">
          <button class="btn btn-primary" onclick="nextFITB()">Next</button>
        </div>
      ` : `
        <div style="text-align:center;margin-top:16px">
          <button class="btn btn-primary" onclick="checkFITB()">Check</button>
        </div>
      `}
    </div>`;
}

function checkFITB() {
  const input = document.getElementById('fitbInput');
  if (!input || !input.value.trim()) { toast('Fill in the blank first', 'error'); return; }
  const item = fitbData[fitbIndex];
  const userAns = input.value.trim().toLowerCase();
  const correct = item.answer.toLowerCase();
  const isCorrect = userAns === correct || correct.includes(userAns) || userAns.includes(correct);
  if (isCorrect) {
    input.classList.add('correct');
    fitbScore++;
  } else {
    input.classList.add('wrong');
  }
  fitbChecked = true;
  // Re-render but keep input state
  const container = document.querySelector('.fitb-container');
  if (container) {
    const checkBtn = container.querySelector('.btn-primary');
    if (checkBtn) {
      checkBtn.outerHTML = `
        <div style="margin-top:16px;padding:12px;border-radius:8px;background:var(--bg-card);font-size:14px">
          <strong>Answer:</strong> ${escHtml(item.answer)}
        </div>
        <div style="text-align:center;margin-top:16px">
          <button class="btn btn-primary" onclick="nextFITB()">Next</button>
        </div>`;
    }
  }
}

function nextFITB() {
  fitbIndex++;
  fitbChecked = false;
  render();
}

/* ============================================================
   AI TUTOR
   ============================================================ */
function startTutor() {
  const set = getSet();
  if (!set) return;
  currentPage = 'tutor';
  tutorMessages = [];
  render();
}

function renderTutor() {
  const set = getSet();
  if (!set) return '';
  const cardContext = set.cards.map(c => `${c.term}: ${c.definition}`).join('\n');

  return `
    <div class="content" style="padding-bottom:0">
      <button class="btn btn-ghost btn-sm" onclick="navigate('set','${set.id}')" style="margin-bottom:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Set
      </button>
      <div class="tutor-container">
        <div class="tutor-messages" id="tutorMessages">
          <div class="tutor-msg ai">Hi! I'm your AI tutor for <strong>${escHtml(set.title)}</strong>. Ask me anything about this material — I'll help explain concepts, give examples, or quiz you on specific topics.</div>
          ${tutorMessages.map(m => `<div class="tutor-msg ${m.role === 'user' ? 'user' : 'ai'}">${escHtml(m.content)}</div>`).join('')}
        </div>
        <div class="tutor-input-area">
          <input type="text" id="tutorInput" placeholder="Ask a question about this material..." onkeydown="if(event.key==='Enter')sendTutorMsg()">
          <button class="btn btn-primary" onclick="sendTutorMsg()">Send</button>
        </div>
      </div>
    </div>
  `;
}

async function sendTutorMsg() {
  const input = document.getElementById('tutorInput');
  const msg = input?.value?.trim();
  if (!msg) return;

  const set = getSet();
  if (!set) return;

  tutorMessages.push({ role: 'user', content: msg });
  input.value = '';
  render();

  const cardContext = set.cards.map(c => `${c.term}: ${c.definition}`).join('\n');
  const sys = `You are a helpful study tutor. The student is studying "${set.title}". Here are their flashcards:\n\n${cardContext}\n\nHelp them understand the material. Give clear, concise explanations. Use examples when helpful. Keep responses focused and under 200 words.`;

  const apiMessages = tutorMessages.map(m => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    content: m.content,
  }));

  try {
    const reply = await callAIChat(sys, apiMessages);
    tutorMessages.push({ role: 'assistant', content: reply });
    render();
  } catch(e) {
    toast(e.message, 'error');
    tutorMessages.pop(); // remove the failed user msg
    render();
  }
}

/* ============================================================
   SETTINGS
   ============================================================ */
function renderSettings() {
  return `
    <div class="settings-container">
      <button class="btn btn-ghost btn-sm" onclick="navigate('home')" style="margin-bottom:16px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <h2 style="font-size:22px;margin-bottom:24px">Settings</h2>

      <div class="settings-section">
        <h3>API Configuration</h3>
        <div class="form-group">
          <label class="form-label">Anthropic API Key</label>
          <input class="form-input" type="password" id="settingsApiKey" value="${settings.apiKey}" placeholder="sk-ant-...">
          <p style="font-size:12px;color:var(--text-muted);margin-top:4px">Your key is stored locally and never sent anywhere except Anthropic's API.</p>
        </div>
        <div class="form-group">
          <label class="form-label">Model</label>
          <select class="form-select" id="settingsModel">
            <option value="claude-sonnet-4-20250514" ${settings.model==='claude-sonnet-4-20250514'?'selected':''}>Claude Sonnet 4 (recommended)</option>
            <option value="claude-haiku-4-5-20251001" ${settings.model==='claude-haiku-4-5-20251001'?'selected':''}>Claude Haiku 4.5 (faster, cheaper)</option>
            <option value="claude-opus-4-6" ${settings.model==='claude-opus-4-6'?'selected':''}>Claude Opus 4.6 (most capable)</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="saveSettingsForm()">Save Settings</button>
      </div>

      <div class="settings-section">
        <h3>Cloud Sync</h3>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Sync your study sets across devices. Push saves your data to the cloud; Pull merges cloud data into this device.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button class="btn btn-primary" onclick="pushToCloud()" ${syncStatus==='syncing'?'disabled':''}>
            ${syncStatus==='syncing'?'Syncing...':'Push to Cloud'}
          </button>
          <button class="btn btn-secondary" onclick="pullFromCloud()" ${syncStatus==='syncing'?'disabled':''}>
            Pull from Cloud
          </button>
          <span style="font-size:12px;color:${syncStatus==='success'?'var(--green)':syncStatus==='error'?'var(--red)':'var(--text-muted)'}">
            ${syncStatus==='success'?'✓ Synced':syncStatus==='error'?'✗ Error':syncStatus==='syncing'?'⟳ Syncing...':''}
          </span>
        </div>
        <p style="font-size:11px;color:var(--text-muted);margin-top:8px">Device ID: ${DEVICE_ID}</p>
      </div>

      <div class="settings-section">
        <h3>Data Management</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-secondary" onclick="exportData()">Export All Data</button>
          <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">Import Data</button>
          <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
          <button class="btn btn-secondary" onclick="clearAllData()" style="color:var(--red)">Clear All Data</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>About</h3>
        <p style="font-size:13px;color:var(--text-dim);line-height:1.6">
          StudyHub is a free, self-hosted AI study platform. All data is stored locally in your browser.
          AI features require an Anthropic API key.
        </p>
      </div>
    </div>
  `;
}

function saveSettingsForm() {
  settings.apiKey = document.getElementById('settingsApiKey').value.trim();
  settings.model = document.getElementById('settingsModel').value;
  saveSettings();
  toast('Settings saved', 'success');
}

function exportData() {
  const data = JSON.stringify({ state, settings: { ...settings, apiKey: '***' } }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `studyhub-export-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('Data exported', 'success');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.state && data.state.sets) {
        state = data.state;
        saveState();
        toast('Data imported', 'success');
        render();
      } else {
        toast('Invalid file format', 'error');
      }
    } catch { toast('Failed to parse file', 'error'); }
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (confirm('Delete ALL study sets and data? This cannot be undone.')) {
    state = { ...defaultState };
    saveState();
    toast('All data cleared', 'success');
    navigate('home');
  }
}

/* ============================================================
   FOLDER MANAGEMENT
   ============================================================ */
function promptNewFolder() {
  const name = prompt('Folder name:');
  if (!name || !name.trim()) return;
  if (state.folders.includes(name.trim())) { toast('Folder already exists', 'error'); return; }
  state.folders.push(name.trim());
  saveState();
  toast(`Folder "${name.trim()}" created`, 'success');
  renderFolders();
}

/* ============================================================
   UTILITIES
   ============================================================ */
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const moonIcon = document.getElementById('themeIconMoon');
  const sunIcon = document.getElementById('themeIconSun');
  const label = document.getElementById('themeLabel');
  if (moonIcon && sunIcon && label) {
    if (theme === 'light') {
      moonIcon.style.display = 'none';
      sunIcon.style.display = '';
      label.textContent = 'Dark Mode';
    } else {
      moonIcon.style.display = '';
      sunIcon.style.display = 'none';
      label.textContent = 'Light Mode';
    }
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('studyhub_theme', next);
  toast(`Switched to ${next} mode`, 'success');
}

// Restore saved theme
applyTheme(localStorage.getItem('studyhub_theme') || 'dark');

/* ============================================================
   INIT
   ============================================================ */
render();

// Auto-detect if no API key and show settings hint
if (!settings.apiKey) {
  setTimeout(() => toast('Set your Anthropic API key in Settings to enable AI features', 'info'), 500);
}

// PWA: Register service worker for offline caching
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'studyhub-v1';
    const ASSETS = [self.location.href.replace(/studyhub-sw\\.js.*/, 'studyhub.html')];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));
    });
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      e.respondWith(fetch(e.request).then(r => {
        const clone = r.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
        return r;
      }).catch(() => caches.match(e.request)));
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob), { scope: '/' }).catch(() => {});
}
</script>
